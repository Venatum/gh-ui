# Writes a release's notes from its commits: `release.yml` runs it on the tag
# being released. Only what a user would notice is kept — features, fixes,
# performance — so `chore`, `docs`, `test`, `refactor` and merges are dropped.
#
# Preview the next release's notes: git cliff --unreleased --strip header

[changelog]
# `group_by` sorts the groups by name: the hidden `<!-- n -->` prefix of each
# group sets that order, and `striptags` removes it from the heading.
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.breaking %}**Breaking:** {% endif %}\
{% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{{ commit.message | upper_first }}\
{% endfor %}
{% else %}
No user-facing change: maintenance and dependency updates only.
{% endfor %}
{% if previous.version and version %}
**Full Changelog**: https://github.com/Venatum/gh-ui/compare/{{ previous.version }}...{{ version }}
{% endif %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
# The first match wins; the last line drops every other type explicitly, as
# a commit left without a group would only raise a warning.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = ".*", skip = true },
]
