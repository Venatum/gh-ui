# Cuts a release when a `v*` tag is pushed:
#   1. checks the tag against Cargo.toml and runs the tests
#   2. builds one binary per platform
#   3. publishes the GitHub release with the binaries attached
#
# Triggered by: git tag v0.1.0 && git push origin v0.1.0
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  BINARY: gh-ui

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A tag that disagrees with Cargo.toml would ship binaries under the wrong
      # number, so we stop before anything is built.
      - name: Compare the tag with Cargo.toml
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          manifest="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$tagged" != "$manifest" ]; then
            echo "::error::tag v$tagged does not match Cargo.toml version $manifest"
            exit 1
          fi
          echo "Releasing $manifest"

      - name: Run the tests
        run: cargo test --locked

  build:
    name: Build ${{ matrix.platform }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `platform` uses Go's OS/arch spelling: that is what `gh` looks for
          # at the end of an asset name when installing an extension.
          - platform: darwin-arm64
            target: aarch64-apple-darwin
            os: macos-latest
          - platform: darwin-amd64
            target: x86_64-apple-darwin
            os: macos-latest
          - platform: linux-amd64
            target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - platform: linux-arm64
            target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            cross: gcc-aarch64-linux-gnu
            linker: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v7

      - name: Add the Rust target
        run: rustup target add ${{ matrix.target }}

      # macOS builds both arches natively; Linux arm64 is cross-compiled, which
      # only needs a matching linker.
      - name: Install the cross-linker
        if: matrix.cross != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.cross }}
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=${{ matrix.linker }}" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          out="target/${{ matrix.target }}/release/$BINARY"
          mkdir -p dist
          # Raw binary: `gh extension install` downloads this one as-is.
          cp "$out" "dist/${BINARY}_${version}_${{ matrix.platform }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: dist/
          if-no-files-found: error

  release:
    name: Publish the GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload the binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --title "$tag" --generate-notes
          gh release upload "$tag" artifacts/* --clobber
