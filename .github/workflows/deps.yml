# Every Monday, runs `cargo update` and opens a pull request when Cargo.lock
# moved — the same chore that used to be done by hand.
#
# Dependabot is not used because its Cargo version updates only follow direct
# dependencies, and those rarely move: what does is the indirect ones, which
# a single `cargo update` refreshes all at once while honouring the
# `rust-version` pinned in Cargo.toml.
#
# A pull request opened with the default GITHUB_TOKEN does not trigger
# `ci.yml`, so the lints and tests run here, before the pull request exists:
# one that gets opened has already passed them.
#
# `cargo audit` runs on every schedule, even when nothing moved: an advisory
# can be published against a version already pinned. An advisory still there
# after the update turns the run red, which is what sends the notification.
# One with no fixed version yet can be silenced in `.cargo/audit.toml`.
name: Dependencies

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# A manual run overlapping the scheduled one would push to the same branch.
concurrency:
  group: deps
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Builds and tests the freshly bumped crates, whose build scripts and
  # proc-macros nobody has reviewed yet: this job holds no write access, and
  # hands its result to `pull-request` as an artifact.
  update:
    name: cargo update, audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.update.outputs.changed }}
      main_vulnerable: ${{ steps.audit_main.outputs.found }}
      update_vulnerable: ${{ steps.audit_update.outputs.found }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Restore only: the key follows main's Cargo.lock, so saving the build
      # of the updated one under it would hand `ci.yml` the wrong artifacts.
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # A prebuilt binary: `cargo install` would compile it on every run.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Audits main's Cargo.lock before touching it: an advisory here means
      # the published version is exposed, so the fix is worth a release.
      #
      # `cargo audit` exits 1 both on an advisory and on an error such as an
      # unreachable advisory database, so the verdict is read from its JSON
      # report instead: no report at all fails the step.
      - name: Audit main
        id: audit_main
        run: |
          cargo audit --json > "$RUNNER_TEMP/audit.json" || true
          found=$(jq -er '.vulnerabilities.found | booleans | tostring' "$RUNNER_TEMP/audit.json")
          jq -r '.vulnerabilities.list[] | "\(.advisory.id) \(.package.name) \(.package.version): \(.advisory.title)"' "$RUNNER_TEMP/audit.json"
          echo "found=$found" >> "$GITHUB_OUTPUT"

      # Its output, which lists every bump, becomes the pull request's body.
      # `pipefail`, or `tee` would hide a failing `cargo update`.
      - name: Update
        id: update
        env:
          CARGO_TERM_COLOR: never
        run: |
          set -o pipefail
          cargo update 2>&1 | tee "$RUNNER_TEMP/update.log"
          if git diff --quiet Cargo.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Lints
        if: steps.update.outputs.changed == 'true'
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        if: steps.update.outputs.changed == 'true'
        run: cargo test --locked

      - name: Audit update
        id: audit_update
        if: steps.update.outputs.changed == 'true'
        run: |
          cargo audit --json > "$RUNNER_TEMP/audit.json" || true
          found=$(jq -er '.vulnerabilities.found | booleans | tostring' "$RUNNER_TEMP/audit.json")
          jq -r '.vulnerabilities.list[] | "\(.advisory.id) \(.package.name) \(.package.version): \(.advisory.title)"' "$RUNNER_TEMP/audit.json"
          echo "found=$found" >> "$GITHUB_OUTPUT"

      - name: Pull request content
        if: steps.update.outputs.changed == 'true'
        env:
          MAIN: ${{ steps.audit_main.outputs.found }}
          UPDATE: ${{ steps.audit_update.outputs.found }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$UPDATE" = true ]; then
            security="⚠️ \`cargo audit\` still reports an advisory after the update: see [the run]($RUN)."
          elif [ "$MAIN" = true ]; then
            security="⚠️ This update fixes a RustSec advisory that main is exposed to: merge it, then release."
          else
            security="\`cargo audit\`: no advisory."
          fi
          mkdir "$RUNNER_TEMP/pr"
          cp Cargo.lock "$RUNNER_TEMP/pr/"
          {
            echo "Weekly \`cargo update\`."
            echo
            echo "$security"
            echo
            echo '```'
            cat "$RUNNER_TEMP/update.log"
            echo '```'
          } > "$RUNNER_TEMP/pr/body.md"

      - uses: actions/upload-artifact@v7
        if: steps.update.outputs.changed == 'true'
        with:
          name: pr
          path: ${{ runner.temp }}/pr

  # Runs no project code: it only carries the tested Cargo.lock into a pull
  # request, which is why it alone gets write access.
  pull-request:
    name: pull request
    needs: update
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        if: needs.update.outputs.changed == 'true'

      - uses: actions/download-artifact@v8
        if: needs.update.outputs.changed == 'true'
        with:
          name: pr
          path: ${{ runner.temp }}/pr

      - name: Tested Cargo.lock
        if: needs.update.outputs.changed == 'true'
        run: cp "$RUNNER_TEMP/pr/Cargo.lock" Cargo.lock

      # Always the same branch: a pull request left unmerged is updated in
      # place the next Monday instead of piling up.
      - uses: peter-evans/create-pull-request@v8
        if: needs.update.outputs.changed == 'true'
        with:
          branch: deps/cargo-update
          delete-branch: true
          add-paths: Cargo.lock
          commit-message: "chore(deps): cargo update"
          title: "chore(deps): cargo update"
          body-path: ${{ runner.temp }}/pr/body.md

      # Red when an advisory remains: in the update itself, or on main when
      # nothing moved. An update that fixes main's advisory stays green — its
      # pull request is what carries the warning.
      - name: Fail on advisory
        if: >-
          needs.update.outputs.update_vulnerable == 'true' ||
          (needs.update.outputs.main_vulnerable == 'true' && needs.update.outputs.changed != 'true')
        run: exit 1
