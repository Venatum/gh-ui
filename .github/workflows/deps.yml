# Every Monday: `cargo update`, then push Cargo.lock straight to main (a pull
# request got forgotten). Not Dependabot: it skips indirect dependencies.
#
# A GITHUB_TOKEN push does not trigger `ci.yml`, so lints, tests and release
# builds run here first.
#
# The run turns red, which sends the notification, when an advisory remains
# or when the update fixed one: that calls for a release. Silence an
# unfixable one in `.cargo/audit.toml`.
name: Dependencies

on:
  schedule:
    # Monday at 04:17 UTC: GitHub delays runs at round hours the most.
    - cron: "17 4 * * 1"
  workflow_dispatch:

# A manual run must not overlap the scheduled one.
concurrency:
  group: deps
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Runs the unreviewed new crates' code (build scripts, proc-macros): no
  # write access here, the tested Cargo.lock goes to `push` as an artifact.
  # On main only: started from another branch, `push` would put that
  # branch's commits on main.
  update:
    name: cargo update, audit
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.update.outputs.changed }}
      main_vulnerable: ${{ steps.audit_main.outputs.found }}
      update_vulnerable: ${{ steps.audit_update.outputs.found }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Restore only: the key is main's Cargo.lock, not the updated one.
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # Prebuilt, unlike `cargo install`.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Main before the update: an advisory here means the release is exposed.
      # The verdict comes from the JSON, as `cargo audit` also exits 1 on
      # errors; no report fails the step.
      - name: Audit main
        id: audit_main
        run: |
          cargo audit --json > "$RUNNER_TEMP/audit.json" || true
          found=$(jq -er '.vulnerabilities.found | booleans | tostring' "$RUNNER_TEMP/audit.json")
          jq -r '.vulnerabilities.list[] | "\(.advisory.id) \(.package.name) \(.package.version): \(.advisory.title)"' "$RUNNER_TEMP/audit.json"
          echo "found=$found" >> "$GITHUB_OUTPUT"

      # `pipefail`: `tee` would hide a failing `cargo update`.
      - name: Update
        id: update
        env:
          CARGO_TERM_COLOR: never
        run: |
          set -o pipefail
          cargo update 2>&1 | tee "$RUNNER_TEMP/update.log"
          if git diff --quiet Cargo.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Lints
        if: steps.update.outputs.changed == 'true'
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        if: steps.update.outputs.changed == 'true'
        run: cargo test --locked

      - name: Audit update
        id: audit_update
        if: steps.update.outputs.changed == 'true'
        run: |
          cargo audit --json > "$RUNNER_TEMP/audit.json" || true
          found=$(jq -er '.vulnerabilities.found | booleans | tostring' "$RUNNER_TEMP/audit.json")
          jq -r '.vulnerabilities.list[] | "\(.advisory.id) \(.package.name) \(.package.version): \(.advisory.title)"' "$RUNNER_TEMP/audit.json"
          echo "found=$found" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        if: steps.update.outputs.changed == 'true'
        with:
          name: cargo-lock
          path: Cargo.lock

  # Every platform `release.yml` ships, so a breaking bump shows before a tag.
  # Same matrix as `release.yml`: change both together.
  #
  # Its steps, not the job, are skipped when nothing moved: a skipped matrix
  # job is shown as a literal "Build ${{ matrix.platform }}".
  build:
    name: Build ${{ matrix.platform }}
    needs: update
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      CHANGED: ${{ needs.update.outputs.changed }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            target: aarch64-apple-darwin
            os: macos-latest
          - platform: darwin-amd64
            target: x86_64-apple-darwin
            os: macos-latest
          - platform: linux-amd64
            target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - platform: linux-arm64
            target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            cross: gcc-aarch64-linux-gnu
            linker: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v7
        if: env.CHANGED == 'true'
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        if: env.CHANGED == 'true'
        with:
          name: cargo-lock

      - name: Add the Rust target
        if: env.CHANGED == 'true'
        run: rustup target add ${{ matrix.target }}

      - name: Install the cross-linker
        if: env.CHANGED == 'true' && matrix.cross != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.cross }}
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=${{ matrix.linker }}" >> "$GITHUB_ENV"

      - name: Build
        if: env.CHANGED == 'true'
        run: cargo build --release --locked --target ${{ matrix.target }}

  # The only job with write access, and it runs no project code.
  push:
    name: push to main
    needs: [ update, build ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The main the update started from: a push since makes ours fail.
      - uses: actions/checkout@v7
        if: needs.update.outputs.changed == 'true'

      - uses: actions/download-artifact@v8
        if: needs.update.outputs.changed == 'true'
        with:
          name: cargo-lock

      # Held back only when the update brings an advisory main did not have:
      # one main already had must not block the fix of another.
      - name: Commit and push
        if: >-
          needs.update.outputs.changed == 'true' &&
          (needs.update.outputs.update_vulnerable != 'true' || needs.update.outputs.main_vulnerable == 'true')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet -m "chore(deps): cargo update" Cargo.lock
          git push origin HEAD:main

      - name: Advisory left
        if: >-
          needs.update.outputs.update_vulnerable == 'true' ||
          (needs.update.outputs.main_vulnerable == 'true' && needs.update.outputs.changed != 'true')
        run: |
          echo "::error::cargo audit still reports an advisory: see the update job's audit steps"
          exit 1

      - name: Advisory fixed
        if: >-
          needs.update.outputs.main_vulnerable == 'true' &&
          needs.update.outputs.changed == 'true' &&
          needs.update.outputs.update_vulnerable != 'true'
        run: |
          echo "::error::the update fixed an advisory the published version is exposed to: cut a release"
          exit 1
