[package]
name = "gh-ui"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "A terminal UI to explore GitHub pull requests across every repo in a folder, htop-style"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/Venatum/gh-ui"
homepage = "https://github.com/Venatum/gh-ui"
keywords = ["github", "pull-request", "tui", "cli", "terminal"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/.github", "/packaging", "/.claude", "/.idea", "/TUTO.md"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dirs = "7.0.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
