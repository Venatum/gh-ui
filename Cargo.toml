[package]
name = "gh-ui"
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
description = "A terminal UI to explore GitHub pull requests across every repo in a folder, htop-style"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/Venatum/gh-ui"
homepage = "https://github.com/Venatum/gh-ui"
keywords = ["github", "pull-request", "tui", "cli", "terminal"]
categories = ["command-line-utilities", "development-tools"]
# Distributed as a `gh` extension only, never as a crate.
publish = false

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dirs = "7.0.0"
# `unstable-rendered-line-info` brings `Paragraph::line_count`: how many rows
# a text takes once wrapped, which makes the detail view's scroll stop
# exactly at its last screenful. A feature flag of ratatui, no new crate.
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
